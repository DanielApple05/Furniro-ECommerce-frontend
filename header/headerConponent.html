<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="headerconp.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../style.css" />
    <script src="../furniro.js"></script>

    <title>Header</title>
  </head>

  <body>
    <header class="w-[100%] bg-[#ffffff]">
      <div class="header-container xl:px-10 px-0 xl:gap-35 gap-5">
        <div class="items-center flex w-full">
          <img
            src="img/furniroLogo.svg"
            alt=""
            class="xl:w-[120px] w-[80px]"
          />
        </div>

        <div class="xl:flex hidden items-center gap-[75px] w-full">
          <a href="../index.html" target="_parent">Home</a>
          <a href="../shop.html" target="_parent">Shop</a>
          <a href="../Footer/footer.html" target="">About</a>
          <a href="../contactPage/contact.html" target="_parent">Contact</a>
        </div>

        <div class="flex items-center gap-[15px]">
          <div class="xl:block hidden xl:w-[50px] w-[20px]">
            <img src="img/userIcon.svg" alt="" />
          </div>
          <div class="xl:w-[50px] w-[20px] ">
            <img src="img/searchIcon.svg" alt="" />
          </div>
          <div class="xl:w-[50px] w-[20px] xl:block hidden">
            <img src="img/heartIcon.svg" alt="" />
          </div>
          <div class="xl:w-[50px] w-[20px]">
            <a href="../cartPage/cart.html" target="_parent">
              <img src="img/cartIcon.svg" alt="" class="cartLogo" id="cartIcon"
            /></a>
          </div>
        </div>

        <div class="xl:hidden block w-30px">
          <img
            src="img/mediaMenu.svg"
            alt="menu-icon"
            id="mobileNavButton"
            class="w-[30px] h-[30px] xl:hidden block"
            onclick=""
          />
        </div>
      </div>

      <div
        id="mobileNavBar"
        class="bg-[#fff3e395] h-[100vh] z-[200] mobile-navbar xl:hidden hidden absolute right-0 top-[80px] w-[100%]" >
        <div class="grid space-y-4 pt-[5px] p-[24px] font-semibold text-[18px]">
          <a href="../index.html" target="_parent">Home</a>
          <a href="../shop.html" target="_parent">Shop</a>
          <a href="../Footer/footer.html" target="">About</a>
          <a href="../contactPage/contact.html" target="_parent">Contact</a>
        </div>
      </div>
    </header>
  </body>
</html>
